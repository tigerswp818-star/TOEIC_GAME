<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Operation KM Dashboard</title>
</head>
<body>
<title>Water Operation KM Dashboard</title>
<style>
  :root {
    --bg: #eef3f6;
    --surface: #ffffff;
    --surface-2: #e6edf2;
    --ink: #10222e;
    --ink-2: #46596577;
    --ink-sec: #465965;
    --muted: #74848f;
    --line: #d3dde4;
    --line-soft: #e2eaef;
    --accent: #2a78d6;
    --accent-deep: #1c5cab;
    --accent-soft: #e3eefb;
    --good: #0d8a56;
    --good-soft: #e0f3ea;
    --warn: #b47a00;
    --warn-soft: #fbf0d7;
    --crit: #ce3737;
    --crit-soft: #fbe4e4;
    --series-1: #2a78d6;
    --series-2: #1baf7a;
    --series-3: #eda100;
    --series-4: #008300;
    --chip-sample: #7a5c00;
    --chip-sample-bg: #fdf3d0;
    --shadow: 0 1px 3px rgba(16,34,46,.08), 0 4px 16px rgba(16,34,46,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1319;
      --surface: #121d27;
      --surface-2: #1a2836;
      --ink: #e7eef4;
      --ink-sec: #a6b7c3;
      --muted: #6d8191;
      --line: #24343f;
      --line-soft: #1d2b36;
      --accent: #3987e5;
      --accent-deep: #6da7ec;
      --accent-soft: #16283e;
      --good: #2cc98b;
      --good-soft: #123227;
      --warn: #f0b03a;
      --warn-soft: #33270e;
      --crit: #ee7272;
      --crit-soft: #3a1a1a;
      --series-1: #3987e5;
      --series-2: #199e70;
      --series-3: #c98500;
      --series-4: #3fa73f;
      --chip-sample: #f4cf6c;
      --chip-sample-bg: #33270e;
      --shadow: 0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="light"] {
    --bg: #eef3f6; --surface: #ffffff; --surface-2: #e6edf2; --ink: #10222e;
    --ink-sec: #465965; --muted: #74848f; --line: #d3dde4; --line-soft: #e2eaef;
    --accent: #2a78d6; --accent-deep: #1c5cab; --accent-soft: #e3eefb;
    --good: #0d8a56; --good-soft: #e0f3ea; --warn: #b47a00; --warn-soft: #fbf0d7;
    --crit: #ce3737; --crit-soft: #fbe4e4;
    --series-1: #2a78d6; --series-2: #1baf7a; --series-3: #eda100; --series-4: #008300;
    --chip-sample: #7a5c00; --chip-sample-bg: #fdf3d0;
    --shadow: 0 1px 3px rgba(16,34,46,.08), 0 4px 16px rgba(16,34,46,.05);
  }
  :root[data-theme="dark"] {
    --bg: #0c1319; --surface: #121d27; --surface-2: #1a2836; --ink: #e7eef4;
    --ink-sec: #a6b7c3; --muted: #6d8191; --line: #24343f; --line-soft: #1d2b36;
    --accent: #3987e5; --accent-deep: #6da7ec; --accent-soft: #16283e;
    --good: #2cc98b; --good-soft: #123227; --warn: #f0b03a; --warn-soft: #33270e;
    --crit: #ee7272; --crit-soft: #3a1a1a;
    --series-1: #3987e5; --series-2: #199e70; --series-3: #c98500; --series-4: #3fa73f;
    --chip-sample: #f4cf6c; --chip-sample-bg: #33270e;
    --shadow: 0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Noto Sans Thai", "Leelawadee UI", "Sarabun", Thonburi, -apple-system, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 230px; flex: 0 0 230px;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 4px 10px 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 10px; }
  .brand .t1 { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
  .brand .t2 { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .brand .wave { color: var(--accent); font-size: 18px; line-height: 1; margin-bottom: 6px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    color: var(--ink-sec); font: inherit; font-size: 13.5px;
    padding: 8px 10px; border-radius: 8px;
  }
  .nav-btn svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
  .nav-sep { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 12px 10px 4px; }
  .sidebar .foot { margin-top: auto; padding: 12px 10px 4px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line-soft); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 22px 28px 60px; }
  .topbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 20px; }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-sec); border: 1px solid var(--line);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .pill.sample { background: var(--chip-sample-bg); color: var(--chip-sample); border-color: transparent; font-weight: 600; }

  .pane { display: none; }
  .pane.active { display: block; }
  .pane > h2 { font-size: 17px; margin: 0 0 4px; }
  .pane > .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; max-width: 70ch; }

  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow);
    min-width: 0;
  }
  .card h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 700; }
  .card .hint { color: var(--muted); font-size: 11.5px; margin: 0 0 12px; }

  .kpi .label { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .value small { font-size: 13px; font-weight: 600; color: var(--ink-sec); }
  .kpi .note { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .kpi.accent .value { color: var(--accent-deep); }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll-x { overflow-x: auto; }

  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; letter-spacing: .03em; white-space: nowrap; }
  .badge.b-code { background: var(--accent-soft); color: var(--accent-deep); font-family: ui-monospace, Consolas, monospace; }
  .badge.b-nodata { background: var(--surface-2); color: var(--muted); font-weight: 500; }
  .badge.b-good { background: var(--good-soft); color: var(--good); }
  .badge.b-warn { background: var(--warn-soft); color: var(--warn); }
  .badge.b-sample { background: var(--chip-sample-bg); color: var(--chip-sample); }

  .tankbar { display: flex; align-items: center; gap: 8px; min-width: 130px; }
  .tankbar .rail { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .tankbar .fill { height: 100%; border-radius: 4px 0 0 4px; background: var(--series-1); }
  .tankbar .pct { font-size: 11px; color: var(--ink-sec); font-variant-numeric: tabular-nums; width: 34px; text-align: right; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-sec); margin-top: 10px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-sec);
    font: inherit; font-size: 12.5px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .search {
    width: 100%; max-width: 420px; display: block;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 14px; font: inherit; margin: 0 0 12px;
  }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

  .km-card { border-left: 3px solid var(--accent); }
  .km-card .cat { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-deep); }
  .km-card h4 { margin: 4px 0 6px; font-size: 14.5px; }
  .km-card p { margin: 0 0 8px; font-size: 13px; color: var(--ink-sec); }
  .km-card .take { font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; color: var(--ink); }
  .km-card .take b { color: var(--accent-deep); }
  .km-card .meta { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .empty {
    border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 34px 24px; text-align: center; color: var(--muted); background: none;
  }
  .empty .big { font-size: 15px; font-weight: 600; color: var(--ink-sec); margin-bottom: 4px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 9px 18px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--accent-deep); }
  .btn:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }
  .btn.ghost { background: var(--surface); color: var(--ink-sec); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--accent-deep); border-color: var(--accent); background: var(--surface); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .flowline { stroke: var(--series-2); stroke-width: 2.5; fill: none; }
  .map-node { cursor: default; }
  .map-node rect.body { fill: var(--surface); stroke: var(--line); rx: 8; }
  .map-node text { fill: var(--ink); }
  .map-label { fill: var(--muted); font-size: 10px; letter-spacing: .08em; }

  svg text { font-family: inherit; }
  .axis-t { fill: var(--muted); font-size: 10px; }
  .gridline { stroke: var(--line-soft); stroke-width: 1; }

  .decoder { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .decoder input {
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 14px; font-family: ui-monospace, Consolas, monospace;
    font-size: 14px; width: 150px; text-transform: uppercase;
  }
  .decoder input:focus-visible { outline: 2px solid var(--accent); border-color: var(--accent); }
  .decode-out { font-size: 13.5px; padding: 10px 14px; border-radius: 9px; background: var(--accent-soft); color: var(--ink); }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--ink); color: var(--bg);
    font-size: 12px; padding: 6px 10px; border-radius: 7px;
    box-shadow: var(--shadow); display: none; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .note-box { font-size: 12.5px; color: var(--ink-sec); background: var(--surface-2); border-radius: 9px; padding: 10px 14px; }
  .warn-box { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 9px; padding: 10px 14px; }

  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex: none; height: auto; position: static; flex-direction: row; flex-wrap: wrap; }
    .sidebar .foot, .nav-sep { display: none; }
    .brand { border: none; margin: 0; width: 100%; padding-bottom: 6px; }
    .main { padding: 16px 14px 60px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .pane.active { animation: fadein .18s ease-out; }
    @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  }
</style>

<div class="app">
  <nav class="sidebar" aria-label="เมนูหลัก">
    <div class="brand">
      <div class="wave">≋</div>
      <div class="t1">Water Operation KM</div>
      <div class="t2">ระบบจัดการองค์ความรู้งานสูบส่ง–สูบจ่ายน้ำ</div>
    </div>
    <div id="nav"></div>
    <div class="foot">
      ต้นแบบ (Prototype) จาก Master Data<br>
      เวอร์ชัน <span id="f-ver"></span> · <span id="f-km"></span> องค์ความรู้
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1 id="pane-title">Overview</h1>
      <span class="pill"><span class="dot"></span>Master Data v<span id="h-ver"></span></span>
      <span class="pill mono">SCADA Snapshot: 3 ก.ค. 2026 · 14:05</span>
      <span class="pill sample" title="กราฟรายชั่วโมงเป็นข้อมูลตัวอย่างเพื่อสาธิตรูปแบบ">บางส่วนใช้ Sample Data</span>
    </div>
    <div id="panes"></div>
  </main>
</div>
<div class="tooltip" id="tooltip"></div>

  (function analytics() {
    const p = $("#pane-analytics");

    /* --- sample pressure optimization curve (labeled Sample) --- */
    const H = 210, W = 560, PX = 44, PY = 18, PB = 34;
    const iw = W - PX - 14, ih = H - PY - PB;
    const base = t => {   /* smooth daily pressure shape 0-24h */
      const morning = 1.55 * Math.exp(-Math.pow((t - 6.4) / 2.1, 2));
      const evening = 0.85 * Math.exp(-Math.pow((t - 18.5) / 2.6, 2));
      return 1.35 + morning + evening + 0.12 * Math.sin(t / 24 * Math.PI * 2);
    };
    const X = t => PX + t / 24 * iw;
    const Y = v => PY + ih - (v - 0.5) / 3.2 * ih;
    const pts = []; for (let t = 0; t <= 24; t += 0.5) pts.push([t, base(t)]);
    const line = pts.map((d, i) => (i ? "L" : "M") + X(d[0]).toFixed(1) + " " + Y(d[1]).toFixed(1)).join("");
    const bandTop = pts.map((d, i) => (i ? "L" : "M") + X(d[0]).toFixed(1) + " " + Y(d[1] + 0.5).toFixed(1)).join("");
    const bandBot = pts.slice().reverse().map(d => "L" + X(d[0]).toFixed(1) + " " + Y(d[1] - 0.5).toFixed(1)).join("");
    const hours = [0, 4, 8, 12, 16, 20, 24];
    const curveSvg = `
      <svg id="curve-svg" viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="กราฟตัวอย่าง Pressure Optimization Curve">
        ${[1, 2, 3].map(v => `<line x1="${PX}" y1="${Y(v)}" x2="${W - 14}" y2="${Y(v)}" class="gridline"/>
          <text x="${PX - 8}" y="${Y(v) + 3}" text-anchor="end" class="axis-t">${v.toFixed(1)}</text>`).join("")}
        ${hours.map(hh => `<text x="${X(hh)}" y="${H - 12}" text-anchor="middle" class="axis-t">${String(hh).padStart(2, "0")}:00</text>`).join("")}
        <path d="${bandTop} ${bandBot} Z" fill="var(--accent)" opacity="0.13"/>
        <path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2.2"/>
        <line x1="${X(5)}" y1="${PY}" x2="${X(5)}" y2="${PY + ih}" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="4 4"/>
        <text x="${X(5) + 5}" y="${PY + 12}" class="axis-t" style="fill:var(--warn);font-weight:700">05:00 เร่งล่วงหน้า</text>
        <circle id="curve-dot" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
        <rect id="curve-hit" x="${PX}" y="${PY}" width="${iw}" height="${ih}" fill="transparent"/>
      </svg>`;

    /* --- rupture signature (sample, small multiples) --- */
    const sig = (title, mkP, mkF, tag) => {
      const w = 250, h = 128, px = 10, py = 12, iw2 = w - 2 * px, ih2 = h - py - 24;
      const P = [], F = [];
      for (let i = 0; i <= 40; i++) { const t = i / 40; P.push([t, mkP(t)]); F.push([t, mkF(t)]); }
      const ln = (arr, col) => `<path d="${arr.map((d, i) => (i ? "L" : "M") + (px + d[0] * iw2).toFixed(1) + " " + (py + ih2 - d[1] * ih2).toFixed(1)).join("")}" fill="none" stroke="${col}" stroke-width="2"/>`;
      return `<div>
        <div style="font-size:12.5px;font-weight:700;margin-bottom:4px">${title} <span class="badge b-sample">Sample</span></div>
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:280px" role="img" aria-label="${title}">
          <line x1="${px}" y1="${py + ih2}" x2="${w - px}" y2="${py + ih2}" class="gridline" style="stroke:var(--line)"/>
          ${ln(F, "var(--series-2)")}${ln(P, "var(--series-1)")}
          <text x="${px}" y="${h - 4}" class="axis-t">${tag}</text>
        </svg>
      </div>`;
    };

      tipShow(`${String(hh).padStart(2, "0")}:${mm} น. · เป้า ${v.toFixed(2)} ม. (±0.5)`, e.clientX, e.clientY);
    });
    hit.addEventListener("mouseleave", () => { dot.style.display = "none"; tipHide(); });
  })();

  /* ============================================================
     RTU MONITORING
  ============================================================ */
  (function rtu() {
    const p = $("#pane-rtu");
    const ov = M.rtuNetworkOverview;
    const chainSteps = ov.dataChain.split("→").map(s => s.trim());
    const BRANCHES = { "01": "บางกอกน้อย", "17": "สมุทรปราการ" };

    p.innerHTML = `
      <h2>RTU Monitoring</h2>
      <p class="sub">โครงข่ายเครื่องวัดระยะไกลกว่า 210 จุดบนท่อประธาน — ข้อมูล RTU รายตัว (สถานะ Online/Offline, Alarm, Last Update) ยังไม่มีข้อมูล</p>
      <div class="grid kpis">
        <div class="card kpi accent"><div class="label">จุดติดตั้งทั้งหมด</div><div class="value">210+ <small>จุด</small></div><div class="note">ยืนยันโดย Playbook</div></div>
        <div class="card kpi"><div class="label">ประเภท P</div><div class="value">Pressure</div><div class="note">วัดแรงดันอย่างเดียว</div></div>
        <div class="card kpi"><div class="label">ประเภท U / UZ</div><div class="value">Ultrasonic</div><div class="note">วัดทั้ง Flow และ Pressure</div></div>
        <div class="card kpi"><div class="label">โปรโตคอลสื่อสาร</div><div class="value">DNP3</div><div class="note">ไร้สายแบบปลอดภัย → OPC Server</div></div>
      </div>
      <div class="grid cols-2">
        <div class="card">
          <h3>เส้นทางข้อมูล (Data Chain)</h3>
          <p class="hint">จากท่อประธานสู่จอ SCADA</p>
          ${chainSteps.map((s, i) => `
            <div style="display:flex;gap:12px;align-items:flex-start;padding:7px 0;${i < chainSteps.length - 1 ? "border-bottom:1px solid var(--line-soft)" : ""}">
              <span class="badge b-code" style="margin-top:2px">${i + 1}</span>
              <span style="font-size:13px">${esc(s)}</span>
            </div>`).join("")}
        </div>
        <div class="card">
          <h3>ตัวถอดรหัสชื่อ RTU</h3>
          <p class="hint">Prefix (ประเภท) + รหัสสาขา 2 หลัก + Node ID — ลองพิมพ์ เช่น UZ0114, P051, UZ1609</p>
          <div class="decoder">
            <input id="rtu-in" value="UZ0114" maxlength="8" aria-label="รหัส RTU">
            <button class="btn" id="rtu-go" type="button">ถอดรหัส</button>
          </div>
          <div class="decode-out" id="rtu-out"></div>
          <p class="hint" style="margin-top:12px">รหัสสาขาที่ทราบแล้ว: 01 = บางกอกน้อย, 17 = สมุทรปราการ — สาขาอื่นยังไม่มีข้อมูล</p>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3>หลักการเลือกจุดวัด</h3>
        <p style="font-size:13px;color:var(--ink-sec);margin:0">${esc(ov.pointSelection)}</p>
      </div>
      <div class="empty" style="margin-top:14px">
        <div class="big">ทะเบียน RTU รายตัวยังไม่มีข้อมูล</div>
        เมื่อได้รับรายการ RTU (ชื่อ, สถานี, ค่าที่ Monitor, สถานะ, Alarm) หน้านี้จะแสดงตารางสถานะแบบเรียลไทม์
      </div>`;

    function decode() {
      const v = $("#rtu-in").value.trim().toUpperCase().replace(/\s+/g, "");
      const m = v.match(/^(UZ|U|P)(\d{2})(\d{1,3})$/) || v.match(/^(UZ|U|P)(\d{2})$/);
      const out = $("#rtu-out");
      if (!m) { out.innerHTML = "รูปแบบไม่ตรง — ตัวอย่างที่ถูกต้อง: <b>UZ0114</b> (Prefix + สาขา 2 หลัก + Node)"; return; }
      const type = m[1] === "P" ? "Pressure Meter (วัดแรงดันอย่างเดียว)" : "Ultrasonic Flow Meter (วัด Flow + Pressure)";
      const br = BRANCHES[m[2]] ? "สาขา" + BRANCHES[m[2]] : "สาขารหัส " + m[2] + " (ยังไม่มีข้อมูลชื่อสาขา)";
      out.innerHTML = `<b class="mono">${esc(v)}</b> → ${type} · ${esc(br)}${m[3] ? " · Node " + esc(m[3]) : ""}`;
    }
    $("#rtu-go").addEventListener("click", decode);
    $("#rtu-in").addEventListener("keydown", e => { if (e.key === "Enter") decode(); });
    decode();
  })();

  /* ============================================================
     SHIFT HANDOVER
  ============================================================ */
  (function shift() {
    const p = $("#pane-shift");
    const fields = [
      ["วันที่ / เวลา", "date, time"], ["ผู้ส่งเวร → ผู้รับเวร", "shiftFrom → shiftTo"],
      ["สถานะระบบ", "systemStatus"], ["Alarm ที่เกิดขึ้น", "alarms[]"],
      ["งานค้าง", "pendingTasks[]"], ["งานที่เสร็จแล้ว", "completedTasks[]"],
      ["สถานีที่ต้องเฝ้าระวัง", "stationsToMonitor[]"], ["ประเด็น Flow/Pressure", "flowPressureIssues[]"],
      ["สิ่งที่ต้องทำต่อ", "nextActions[]"], ["หมายเหตุ", "note"]
    ];
    p.innerHTML = `
      <h2>บันทึกรับ–ส่งเวร</h2>
      <p class="sub">ยังไม่มีข้อมูลบันทึกรับ–ส่งเวร — โครงสร้างข้อมูลเตรียมพร้อมแล้วตามรูปแบบด้านล่าง</p>
      <div class="empty" style="margin-bottom:14px">
        <div class="big">ยังไม่มีบันทึกรับ–ส่งเวร</div>
        เมื่อได้รับข้อมูลเวรชุดแรก หน้านี้จะแสดงไทม์ไลน์การส่งเวร พร้อม Alarm งานค้าง และสิ่งที่ต้องติดตาม
      </div>
      <div class="card">
        <h3>โครงสร้างข้อมูลที่รองรับแล้ว</h3>
        <p class="hint">ตาม Master Data schema — ส่งข้อมูลตามหัวข้อเหล่านี้ได้เลย</p>
        <div class="scroll-x"><table>
          <thead><tr><th>หัวข้อ</th><th>Field</th></tr></thead>
          <tbody>${fields.map(f => `<tr><td>${f[0]}</td><td class="num" style="color:var(--muted)">${f[1]}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>`;
  })();

  /* ============================================================
     KM LIBRARY
  ============================================================ */
  (function km() {
    const p = $("#pane-km");
    const cats = ["ทั้งหมด", ...new Set(M.knowledgeBase.map(k => k.category))];
    p.innerHTML = `
      <h2>คลังองค์ความรู้ (${M.knowledgeBase.length} เรื่อง)</h2>
      <p class="sub">สะสมจากบันทึกการเรียนรู้งาน ณ กคจ. และ Smart Waterworks Playbook — ค้นหาหรือกรองตามหมวดได้</p>
      <input class="search" id="km-q" type="search" placeholder="ค้นหา เช่น RTU, ผันน้ำ, น้ำเค็ม…" aria-label="ค้นหาองค์ความรู้">
      <div class="chips" id="km-chips">${cats.map((c, i) =>
        `<button class="chip${i === 0 ? " on" : ""}" data-cat="${esc(c)}" type="button">${esc(c)}</button>`).join("")}</div>
      <div class="grid cols-2" id="km-list"></div>`;

    let cat = "ทั้งหมด", q = "";
    function render() {
      const list = M.knowledgeBase.filter(k => {
        const okCat = cat === "ทั้งหมด" || k.category === cat;
        const hay = (k.topic + " " + k.description + " " + k.keyTakeaway + " " + k.category).toLowerCase();
        return okCat && (!q || hay.indexOf(q) >= 0);
      });
      $("#km-list").innerHTML = list.length ? list.map(k => `
        <div class="card km-card">
          <div class="cat">${esc(k.category)}</div>
          <h4>${esc(k.topic)}</h4>
          <p>${esc(k.description)}</p>
          ${isNoData(k.example) ? "" : `<p style="font-size:12px;color:var(--muted)">ตัวอย่าง: ${esc(k.example)}</p>`}
          <div class="take"><b>จำให้ขึ้นใจ:</b> ${esc(k.keyTakeaway)}</div>
          ${(k.relatedStation || k.relatedSystem) ? `<div class="meta">เกี่ยวข้อง: ${esc([k.relatedStation, k.relatedSystem].filter(Boolean).join(" · "))}</div>` : ""}
        </div>`).join("")
        : `<div class="empty" style="grid-column:1/-1"><div class="big">ไม่พบองค์ความรู้ที่ตรงเงื่อนไข</div>ลองเปลี่ยนคำค้นหรือเลือกหมวด "ทั้งหมด"</div>`;
    }
    $("#km-chips").addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      cat = b.dataset.cat;
      document.querySelectorAll("#km-chips .chip").forEach(c => c.classList.toggle("on", c === b));
      render();
    });
    $("#km-q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });
    render();
  })();

  /* ============================================================
     DATA UPLOAD
  ============================================================ */
  (function upload() {
    const p = $("#pane-upload");
    p.innerHTML = `
      <h2>Data Upload &amp; Export</h2>
      <p class="sub">ต้นแบบนี้ฝังข้อมูลจาก Master Data v${M.dataVersion} — ดาวน์โหลด JSON ได้ทันที ส่วนการอัปโหลด CSV/JSON และ Reset เป็น Sample Data จะพร้อมในเวอร์ชัน React</p>
      <div class="grid cols-2">
        <div class="card">
          <h3>Export ข้อมูล</h3>
          <p class="hint">ดาวน์โหลด Master Data ทั้งชุดเป็นไฟล์ JSON</p>
          <button class="btn" id="btn-export" type="button">ดาวน์โหลด master-data.json</button>
        </div>
        <div class="card">
          <h3>ความสามารถที่วางแผนไว้ (เวอร์ชันเต็ม)</h3>
          <table style="font-size:13px">
            <tr><td>อัปโหลด CSV / JSON เพื่ออัปเดตค่าสถานี</td><td><span class="badge b-warn">วางแผนแล้ว</span></td></tr>
            <tr><td>Reset เป็น Sample Data</td><td><span class="badge b-warn">วางแผนแล้ว</span></td></tr>
            <tr><td>Pump Capacity · Alarm History · Maintenance</td><td><span class="badge b-nodata">Future Add-on</span></td></tr>
            <tr><td>AI Chatbot ตอบจากคลังองค์ความรู้</td><td><span class="badge b-nodata">Future Add-on</span></td></tr>
          </table>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3>ประเด็นที่รอการยืนยัน (${M.pendingConfirmations.length} ข้อ)</h3>
        <p class="hint">ข้อมูลที่พบความไม่สอดคล้องหรือยังตีความไม่ได้ — ระบบจะไม่เดาข้อมูลจริง</p>
        ${M.pendingConfirmations.map(c => `<div class="warn-box" style="margin-bottom:8px">${esc(c)}</div>`).join("")}
      </div>`;
    $("#btn-export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(M, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "master-data-v" + M.dataVersion + ".json";
      a.click(); URL.revokeObjectURL(a.href);
    });
  })();

  /* ---------- generic data-tip hover ---------- */
  document.addEventListener("mousemove", e => {
    const t = e.target.closest("[data-tip]");
    if (t) tipShow(esc(t.getAttribute("data-tip")), e.clientX, e.clientY);
    else if (!e.target.closest("#curve-hit")) tipHide();
  });

  show("overview");
})();
</script>
