name: Deploy Water KM Dashboard to GitHub Pages

on:
  push:
    branches:
      - claude/water-operation-km-dashboard-b08042
    paths:
      - 'water-km-dashboard/**'
      - '.github/workflows/deploy-water-km-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish dashboard to gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp water-km-dashboard/dashboard-prototype.html /tmp/site/index.html
          cp water-km-dashboard/data/master-data.json /tmp/site/master-data.json
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy dashboard from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
