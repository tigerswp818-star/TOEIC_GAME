<script>
/* =====================================================================
 * TOEIC Quest: Conquer 990
 * Script.html – Front-end controller
 * ---------------------------------------------------------------------
 * Final build (Phase 5H):
 *   Public API (window.TOEICQuest):
 *     - initApp()              app boot
 *     - resetGame()            full state reset → Start screen
 *     - startGame()            Start screen → Mode screen (validates inputs)
 *     - selectMode(mode)       Mode screen → Game screen (loads questions)
 *     - loadQuestions(mode)    Server fetch via getQuestions
 *     - renderQuestion()       Paint current question card
 *     - startTimer()           Begin per-question countdown
 *     - stopTimer()            Cancel countdown
 *     - handleAnswer(choice)   Score + reveal feedback
 *     - showExplanation()      Reveal Thai explanation + tip
 *     - nextQuestion()         Advance or finishGame
 *     - finishGame()           End round + submit + render result
 *     - submitScore()          Server save via submitGameResult
 *     - renderResult(stats)    Paint result screen
 *     - loadLeaderboard()      Server fetch via getLeaderboard
 *     - renderLeaderboard(d)   Paint leaderboard table
 *     - goToStartScreen()      Navigation helper
 *     - goToModeSelection()    Navigation helper
 *     - showScreen / showToast / showError
 *
 * All server calls go through google.script.run.
 * ===================================================================== */

(function () {
  'use strict';


  /* =====================================================================
   * 1. GAME CONSTANTS
   * ---------------------------------------------------------------------
   *  Initial defaults. Real values are overlaid by getSettings() once
   *  the back-end responds.
   * ===================================================================== */

  var CONSTANTS = {
    QUESTIONS_PER_ROUND: 10,
    TIMER_SECONDS:       15,
    BASE_POINT:          10,
    SPEED_BONUS:         5,
    SPEED_BONUS_LIMIT:   5,    // seconds — answer within this for bonus
    STREAK_BONUS:        10,
    STREAK_INTERVAL:     3,    // every Nth correct in a row earns streak
    EXP_PER_ROUND:       20,
    COIN_PER_CORRECT:    5,
    EXP_PER_LEVEL:       100,
    BADGE_THRESHOLD:     0.8,
    BADGE_NAME:          'TOEIC Warrior',
    MAX_NAME_LENGTH:     30,
    ALLOWED_TARGETS:     [500, 650, 750, 850],
    ALLOWED_MODES:       ['Vocab Rush', 'Grammar Sprint', 'Reading Mission']
  };

  /** Mapping of logical screen names to DOM IDs. */
  var SCREENS = {
    start:       'screenStart',
    mode:        'screenMode',
    game:        'screenGame',
    result:      'screenResult',
    leaderboard: 'screenLeaderboard'
  };


  /* =====================================================================
   * 2. APP STATE
   * ---------------------------------------------------------------------
   *  Single source of truth for the running session. Mutated by the
   *  controller functions; never read directly by the DOM helpers.
   * ===================================================================== */

  var state = {
    // Player profile (set on the start screen).
    playerName:  '',
    targetScore: null,

    // Current round.
    mode:        '',
    questions:   [],
    currentIdx:  0,

    // Per-question runtime.
    timer: {
      intervalId:    null,
      secondsLeft:   CONSTANTS.TIMER_SECONDS,
      questionStart: 0,
      locked:        false   // true once an answer has been registered
    },

    // Round totals.
    score:        0,
    correctCount: 0,
    wrongCount:   0,
    streak:       0,
    exp:          0,
    coin:         0,
    level:        1,
    badge:        '',
    mistakes:     [],

    // Cached settings from the server (overlaid in initApp).
    settings: null,

    // The most recent screen (for the back button).
    activeScreen: 'start'
  };


  /* =====================================================================
   * 3. DOM HELPERS
   * ===================================================================== */

  /**
   * $ – querySelector shortcut.
   * @param {string} sel CSS selector.
   * @param {Element} [root] Optional root (defaults to document).
   * @return {Element|null}
   */
  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  /**
   * $$ – querySelectorAll shortcut returning a real Array.
   * @param {string} sel CSS selector.
   * @param {Element} [root] Optional root (defaults to document).
   * @return {Array<Element>}
   */
  function $$(sel, root) {
    var list = (root || document).querySelectorAll(sel);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      out.push(list[i]);
    }
    return out;
  }

  /**
   * setText – Sets textContent on an element if it exists.
   * Silently no-ops if the element is missing so optional UI slots
   * never throw.
   * @param {string} sel CSS selector.
   * @param {string} text New text.
   */
  function setText(sel, text) {
    var el = $(sel);
    if (el) {
      el.textContent = (text === null || text === undefined) ? '' : String(text);
    }
  }

  /**
   * setHidden – Toggles the `hidden` utility class.
   * @param {string} sel CSS selector.
   * @param {boolean} hidden Whether the element should be hidden.
   */
  function setHidden(sel, hidden) {
    var el = $(sel);
    if (!el) return;
    if (hidden) {
      el.classList.add('hidden');
    } else {
      el.classList.remove('hidden');
    }
  }


  /* =====================================================================
   * 4. SCREEN MANAGEMENT
   * ===================================================================== */

  /**
   * showScreen – Activates exactly one screen, hides all the others.
   * Updates state.activeScreen so other code can branch on it.
   * @param {string} name One of the keys in SCREENS.
   */
  function showScreen(name) {
    var targetId = SCREENS[name];
    if (!targetId) {
      console.warn('showScreen: unknown screen name "' + name + '"');
      return;
    }

    // Toggle .active on every screen.
    var screens = $$('.screen');
    for (var i = 0; i < screens.length; i++) {
      var el = screens[i];
      if (el.id === targetId) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    }

    state.activeScreen = name;

    // Bring the new screen into view (helps when the previous screen
    // was scrolled).
    if (window.scrollTo) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }


  /* =====================================================================
   * 5. LOADING & TOAST HELPERS
   * ===================================================================== */

  /**
   * showLoading – Displays the global overlay with an optional message.
   * @param {string} [message] Thai message shown under the spinner.
   */
  function showLoading(message) {
    var overlay = $('#loadingOverlay');
    if (!overlay) return;
    setText('#loadingText', message || 'กำลังโหลด...');
    overlay.classList.remove('hidden');
    overlay.setAttribute('aria-hidden', 'false');
  }

  /** Hides the loading overlay. */
  function hideLoading() {
    var overlay = $('#loadingOverlay');
    if (!overlay) return;
    overlay.classList.add('hidden');
    overlay.setAttribute('aria-hidden', 'true');
  }

  /** Internal handle for the toast auto-dismiss timer. */
  var toastTimerId = null;

  /**
   * showToast – Briefly displays a status message at the bottom of the
   * viewport. Tone selects styling: 'info' (default), 'success', 'error'.
   * @param {string} message Body text (Thai is fine).
   * @param {string} [tone]  'info' | 'success' | 'error'.
   * @param {number} [ms]    Auto-dismiss delay in ms (default 3200).
   */
  function showToast(message, tone, ms) {
    var el = $('#toast');
    if (!el) return;

    el.classList.remove('error', 'success');
    if (tone === 'error')   el.classList.add('error');
    if (tone === 'success') el.classList.add('success');

    el.textContent = message || '';
    el.classList.remove('hidden');

    if (toastTimerId) {
      clearTimeout(toastTimerId);
    }
    toastTimerId = setTimeout(function () {
      el.classList.add('hidden');
      toastTimerId = null;
    }, typeof ms === 'number' ? ms : 3200);
  }

  /** Convenience: display an error toast (reddish). */
  function showError(message) {
    showToast(message || 'เกิดข้อผิดพลาด กรุณาลองใหม่', 'error', 4500);
  }


  /* =====================================================================
   * 6. APP BOOT & RESET
   * ===================================================================== */

  /**
   * initApp – Wires up the start screen, fetches server settings, and
   * attaches the minimum set of listeners needed before any game flow
   * is created. The full set of game-flow listeners (mode, choices,
   * next, leaderboard, etc.) will be added in later phases.
   */
  function initApp() {
    // Start visible on the Start screen.
    showScreen('start');

    // Wire all listeners that the current build supports.
    wireStartScreenInputs_();
    wireModeScreenInputs_();
    wireGameScreenInputs_();
    wireResultScreenInputs_();
    wireLeaderboardScreenInputs_();

    // Attempt to fetch server-side settings (timer, scoring, etc.).
    // Fall back silently to CONSTANTS if the call fails or is slow.
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (settings) {
          applySettings_(settings);
        })
        .withFailureHandler(function (err) {
          console.warn('getSettings failed, using defaults: ' + err);
        })
        .getSettings();
    }
  }

  /**
   * resetGame – Clears every per-round field in state, removes any
   * selection from the start screen, and returns the user to the
   * Start screen.
   *
   * Used both at app boot (defensive) and from the "Home" buttons on
   * later screens.
   */
  function resetGame() {
    // Stop any running timer through the canonical path.
    if (typeof stopTimer === 'function') {
      stopTimer();
    } else if (state.timer && state.timer.intervalId) {
      clearInterval(state.timer.intervalId);
      state.timer.intervalId = null;
    }

    // Reset everything except the cached settings, which we keep so
    // we don't need to re-fetch on every round.
    var keepSettings = state.settings;
    state.playerName  = '';
    state.targetScore = null;
    state.mode        = '';
    state.questions   = [];
    state.currentIdx  = 0;
    state.timer = {
      intervalId:    null,
      secondsLeft:   CONSTANTS.TIMER_SECONDS,
      questionStart: 0,
      locked:        false
    };
    state.score        = 0;
    state.correctCount = 0;
    state.wrongCount   = 0;
    state.streak       = 0;
    state.exp          = 0;
    state.coin         = 0;
    state.level        = 1;
    state.badge        = '';
    state.mistakes     = [];
    state.settings     = keepSettings;

    // Clear the start screen inputs.
    var nameEl = $('#playerNameInput');
    if (nameEl) nameEl.value = '';

    var chips = $$('#targetScoreOptions .option-chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.remove('selected');
      chips[i].setAttribute('aria-checked', 'false');
    }

    // Re-show the start screen.
    showScreen('start');
  }


  /* =====================================================================
   * 7. GAME FLOW — START & MODE SELECTION
   * ===================================================================== */

  /**
   * startGame – Entry from the Start screen.
   * Reads the player name and selected target score, validates them,
   * stores them on state, and transitions to the Mode Selection screen.
   * Shows clear, Thai validation errors via the toast helper instead
   * of using browser alerts.
   */
  function startGame() {
    var nameEl = $('#playerNameInput');
    var rawName = nameEl ? nameEl.value : '';

    // ---- Trim and length-cap the player name ---------------------------
    var name = (rawName || '').replace(/\s+/g, ' ').trim();
    if (name.length > CONSTANTS.MAX_NAME_LENGTH) {
      name = name.substring(0, CONSTANTS.MAX_NAME_LENGTH);
    }

    // ---- Validate: name not empty -------------------------------------
    if (!name) {
      showError('กรุณากรอกชื่อผู้เล่นก่อนเริ่มเกม');
      if (nameEl) {
        nameEl.focus();
      }
      return;
    }

    // ---- Validate: target score chosen --------------------------------
    if (!state.targetScore ||
        CONSTANTS.ALLOWED_TARGETS.indexOf(state.targetScore) === -1) {
      showError('กรุณาเลือกคะแนนเป้าหมาย TOEIC ก่อน');
      return;
    }

    // ---- Save profile to state ----------------------------------------
    state.playerName = name;

    // Sync the name back into the input in case we trimmed it.
    if (nameEl) {
      nameEl.value = name;
    }

    // Update the greeting on the Mode screen.
    setText('#modePlayerName', name);

    // ---- Transition to Mode Selection ---------------------------------
    showScreen('mode');
  }


  /**
   * selectMode – Entry from the Mode Selection screen.
   * Persists the chosen mode, clears any leftover round data, moves to
   * the Game screen, and hands off to loadQuestions().
   *
   * @param {string} mode One of CONSTANTS.ALLOWED_MODES.
   */
  function selectMode(mode) {
    // ---- Validate the mode against the allowlist ----------------------
    if (CONSTANTS.ALLOWED_MODES.indexOf(mode) === -1) {
      showError('โหมดที่เลือกไม่ถูกต้อง');
      return;
    }

    // ---- Reset per-round game state -----------------------------------
    // We keep the player profile (name + target) and any cached settings
    // so the user can play multiple rounds without re-entering details.
    stopTimer();
    state.mode         = mode;
    state.questions    = [];
    state.currentIdx   = 0;
    state.timer = {
      intervalId:    null,
      secondsLeft:   CONSTANTS.TIMER_SECONDS,
      questionStart: 0,
      locked:        false
    };
    state.score        = 0;
    state.correctCount = 0;
    state.wrongCount   = 0;
    state.streak       = 0;
    state.exp          = 0;
    state.coin         = 0;
    state.level        = 1;
    state.badge        = '';
    state.mistakes     = [];

    // ---- Move to the game screen --------------------------------------
    // The game screen will be fully populated by renderQuestion() in a
    // later phase. For now it shows a card with the timer/HUD shell.
    showScreen('game');

    // ---- Hand off to question loader ----------------------------------
    loadQuestions(mode);
  }


  /**
   * loadQuestions – Fetches a fresh batch of questions from the back
   * end via google.script.run.getQuestions(mode, limit). Manages the
   * loading overlay, validates the response, resets per-round counters,
   * and hands control to renderQuestion() on success.
   *
   * On any failure (server error, empty result), shows a Thai error
   * toast and routes the user back to the Mode Selection screen so
   * they can try again.
   *
   * @param {string} mode One of CONSTANTS.ALLOWED_MODES.
   */
  function loadQuestions(mode) {
    // ---- Validate mode (defensive, also guards direct callers) --------
    if (CONSTANTS.ALLOWED_MODES.indexOf(mode) === -1) {
      showError('โหมดที่เลือกไม่ถูกต้อง');
      showScreen('mode');
      return;
    }

    // ---- Show loading overlay -----------------------------------------
    showLoading('กำลังโหลดคำถาม...');

    // ---- Reset round counters defensively (selectMode already did,
    //      but loadQuestions may also be called as a stand-alone retry).
    state.questions    = [];
    state.currentIdx   = 0;
    state.score        = 0;
    state.correctCount = 0;
    state.wrongCount   = 0;
    state.streak       = 0;
    state.exp          = 0;
    state.coin         = 0;
    state.level        = 1;
    state.badge        = '';
    state.mistakes     = [];

    // ---- Guard against the google.script.run bridge being missing
    //      (e.g. when previewing the file outside Apps Script). --------
    if (!window.google || !google.script || !google.script.run) {
      hideLoading();
      showError('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ในขณะนี้');
      showScreen('mode');
      return;
    }

    var limit = CONSTANTS.QUESTIONS_PER_ROUND || 10;

    google.script.run
      .withSuccessHandler(function (questions) {
        handleQuestionsLoaded_(questions, mode);
      })
      .withFailureHandler(function (err) {
        handleQuestionsFailed_(err);
      })
      .getQuestions(mode, limit);
  }


  /**
   * handleQuestionsLoaded_ – Success path for loadQuestions().
   * Validates the payload, stores it on state, and triggers the first
   * render. Empty arrays are treated as a soft error.
   *
   * @param {Array<Object>} questions Array returned by getQuestions().
   * @param {string} mode             Mode requested (kept for context).
   * @private
   */
  function handleQuestionsLoaded_(questions, mode) {
    hideLoading();

    // Validate response shape.
    if (!questions || !questions.length) {
      showError(
        'ยังไม่มีคำถามในโหมดนี้ กรุณาเพิ่มคำถามในชีต Questions ' +
        'หรือเลือกโหมดอื่น'
      );
      showScreen('mode');
      return;
    }

    // Defensive: ensure each question has the minimum fields. Filter
    // out malformed rows so renderQuestion never crashes on bad data.
    var clean = [];
    for (var i = 0; i < questions.length; i++) {
      var q = questions[i];
      if (q && q.questionText && q.choices &&
          (q.choices.A || q.choices.B || q.choices.C || q.choices.D)) {
        clean.push(q);
      }
    }

    if (clean.length === 0) {
      showError('ข้อมูลคำถามผิดพลาด กรุณาลองใหม่');
      showScreen('mode');
      return;
    }

    state.questions  = clean;
    state.currentIdx = 0;
    state.mode       = mode;

    // Render the first question.
    renderQuestion();
  }


  /**
   * handleQuestionsFailed_ – Failure path for loadQuestions().
   * Surfaces a friendly Thai error and returns the user to the Mode
   * Selection screen so they can retry without restarting the round.
   *
   * @param {Error|string} err The failure reason from Apps Script.
   * @private
   */
  function handleQuestionsFailed_(err) {
    hideLoading();
    var msg = (err && err.message) ? err.message : String(err || '');
    console.warn('getQuestions failed: ' + msg);
    showError('โหลดคำถามไม่สำเร็จ กรุณาลองใหม่');
    showScreen('mode');
  }


  /* =====================================================================
   * 8. GAME FLOW — RENDERING
   * ===================================================================== */

  /**
   * renderQuestion – Paints the current question on the Game screen.
   * Pulls the question pointed to by state.currentIdx, updates the HUD
   * and progress bar, shows the optional passage, fills the choice
   * buttons, clears any leftover feedback, unlocks the timer, and
   * hands off to startTimer().
   *
   * If currentIdx has run past the end of the queue, this delegates to
   * finishGame() (added in a later phase) instead.
   */
  function renderQuestion() {
    // ---- Out-of-range → end of round ---------------------------------
    if (state.currentIdx >= state.questions.length) {
      if (typeof finishGame === 'function') {
        finishGame();
      }
      return;
    }

    var q = state.questions[state.currentIdx];
    if (!q) {
      showError('ไม่พบคำถาม กรุณาลองใหม่');
      showScreen('mode');
      return;
    }

    // ---- HUD + progress bar ------------------------------------------
    updateGameHUD();
    updateProgressBar();

    // ---- Passage (Reading Mission) -----------------------------------
    var passageEl = $('#passageBox');
    if (passageEl) {
      var passage = (q.passage || '').toString();
      if (passage && passage.trim() !== '') {
        passageEl.textContent = passage;
        passageEl.classList.remove('hidden');
        passageEl.scrollTop = 0;
      } else {
        passageEl.textContent = '';
        passageEl.classList.add('hidden');
      }
    }

    // ---- Question text ------------------------------------------------
    setText('#questionText', q.questionText || '');

    // ---- Choices ------------------------------------------------------
    renderChoices(q);

    // ---- Clear any prior feedback / answer state ---------------------
    clearQuestionFeedback();

    // ---- Unlock answers, record start time ---------------------------
    state.timer.locked        = false;
    state.timer.questionStart = Date.now();
    state.timer.secondsLeft   = CONSTANTS.TIMER_SECONDS;
    setText('#timerSeconds', CONSTANTS.TIMER_SECONDS);
    var timerFill = $('#timerFill');
    if (timerFill) {
      timerFill.style.width = '100%';
      timerFill.classList.remove('warning');
    }

    // ---- Hand off to timer (added in Phase 5E) -----------------------
    if (typeof startTimer === 'function') {
      startTimer();
    }
  }


  /**
   * updateGameHUD – Refreshes every dynamic field in the game header:
   * current question index, total count, score, and streak. Falls back
   * to safe defaults when the round is not fully initialised yet.
   */
  function updateGameHUD() {
    var total = state.questions.length || CONSTANTS.QUESTIONS_PER_ROUND;
    var index = Math.min(state.currentIdx + 1, total);

    setText('#hudIndex', index);
    setText('#hudTotal', total);
    setText('#hudScore', state.score);
    setText('#hudStreak', state.streak);
  }


  /**
   * renderChoices – Fills the four choice buttons with the values from
   * the supplied question and re-enables them. Letters are A, B, C, D.
   * The click-to-handleAnswer wiring is attached once in
   * wireGameScreenInputs_(); each render only refreshes the visible
   * text and resets visual state.
   *
   * @param {Object} question The question object from getQuestions().
   */
  function renderChoices(question) {
    var letters = ['A', 'B', 'C', 'D'];
    var choices = (question && question.choices) || {};

    for (var i = 0; i < letters.length; i++) {
      var L = letters[i];
      var btn = $('#choicesBox .choice-btn[data-choice="' + L + '"]');
      if (!btn) continue;

      // Update the visible answer text.
      var textEl = $('[data-slot="' + L + '"]', btn);
      if (textEl) {
        textEl.textContent = choices[L] || '';
      }

      // Reset visual + interactive state for this round of rendering.
      btn.disabled = false;
      btn.classList.remove('correct', 'wrong', 'muted', 'disabled');
      btn.setAttribute('aria-disabled', 'false');
    }
  }


  /**
   * clearQuestionFeedback – Hides the feedback panel and empties any
   * leftover tone classes / text from the previous question, so each
   * render starts visually clean.
   */
  function clearQuestionFeedback() {
    var fb = $('#feedbackBox');
    if (fb) fb.classList.add('hidden');

    var hdr = $('#feedbackHeader');
    if (hdr) {
      hdr.classList.remove('correct', 'wrong', 'timeout');
      hdr.textContent = '';
    }

    setText('#feedbackExplanation', '');
    setText('#feedbackTip', '');
  }


  /**
   * updateProgressBar – Sets the progress-bar fill width to the
   * percentage of questions completed BEFORE the current one. Run at
   * the start of each render so the bar grows step by step.
   */
  function updateProgressBar() {
    var total = state.questions.length || CONSTANTS.QUESTIONS_PER_ROUND;
    var current = Math.max(0, Math.min(state.currentIdx, total));
    var pct = total > 0 ? Math.round((current / total) * 100) : 0;

    var fill = $('#progressFill');
    if (fill) {
      fill.style.width = pct + '%';
    }
  }


  /* =====================================================================
   * 9. GAME FLOW — TIMER
   * ===================================================================== */

  /**
   * startTimer – Begins the per-question countdown.
   * Always stops any existing timer first, so only one interval is
   * active at a time. Records the question start time so handleAnswer()
   * can later award a speed bonus.
   */
  function startTimer() {
    // Defensive: never run two intervals in parallel.
    stopTimer();

    state.timer.secondsLeft   = CONSTANTS.TIMER_SECONDS;
    state.timer.questionStart = Date.now();
    state.timer.locked        = false;

    // Paint the initial state immediately (so the UI reflects the
    // starting value before the first 1s tick).
    updateTimerDisplay();

    // Tick every second. We use setInterval (rather than chained
    // setTimeouts) so the cadence is steady even under load.
    state.timer.intervalId = setInterval(function () {
      // If the user has already answered, stop ticking.
      if (state.timer.locked) {
        stopTimer();
        return;
      }

      state.timer.secondsLeft -= 1;
      updateTimerDisplay();

      if (state.timer.secondsLeft <= 0) {
        handleTimeUp();
      }
    }, 1000);
  }


  /**
   * stopTimer – Cancels the running interval (if any) and clears the
   * stored handle. Safe to call repeatedly.
   */
  function stopTimer() {
    if (state.timer && state.timer.intervalId) {
      clearInterval(state.timer.intervalId);
      state.timer.intervalId = null;
    }
  }


  /**
   * updateTimerDisplay – Refreshes the seconds-remaining label and the
   * timer-bar fill. Adds the .warning class to the bar in the last
   * five seconds so the CSS pulse animation kicks in.
   */
  function updateTimerDisplay() {
    var sec = Math.max(0, state.timer.secondsLeft);
    setText('#timerSeconds', sec);

    var total = CONSTANTS.TIMER_SECONDS || 1;
    var pct = Math.max(0, Math.min(100, (sec / total) * 100));

    var fill = $('#timerFill');
    if (fill) {
      fill.style.width = pct + '%';
      if (sec <= 5) {
        fill.classList.add('warning');
      } else {
        fill.classList.remove('warning');
      }
    }
  }


  /**
   * handleTimeUp – Runs when the countdown hits zero with no answer.
   * Treated as a wrong answer with an empty selection:
   *   - Lock further input and stop the timer.
   *   - Disable every choice button and highlight the correct one.
   *   - Increment wrong count, reset streak.
   *   - Push a mistake row (selectedAnswer = '') to state.mistakes.
   *   - Reveal the feedback panel with explanation + tip.
   *   - Refresh the HUD.
   */
  function handleTimeUp() {
    // 1. Lock answers and stop ticking.
    state.timer.locked = true;
    stopTimer();

    var q = state.questions[state.currentIdx];
    var correctLetter = q && q.correctAnswer ? q.correctAnswer : '';

    // 2. Disable every choice button visually + interactively.
    var choiceBtns = $$('#choicesBox .choice-btn');
    for (var i = 0; i < choiceBtns.length; i++) {
      var btn = choiceBtns[i];
      btn.disabled = true;
      btn.setAttribute('aria-disabled', 'true');
      btn.classList.add('disabled');

      // Highlight the correct answer; mute the others.
      var letter = btn.getAttribute('data-choice');
      if (correctLetter && letter === correctLetter) {
        btn.classList.add('correct');
      } else {
        btn.classList.add('muted');
      }
    }

    // 3. Update round counters: wrong + reset streak.
    state.wrongCount += 1;
    state.streak = 0;

    // 4. Log the mistake (selectedAnswer empty = timed out).
    if (q) {
      state.mistakes.push({
        mode:           state.mode,
        questionId:     q.questionId || '',
        questionText:   q.questionText || '',
        selectedAnswer: '',
        correctAnswer:  correctLetter,
        category:       q.category || ''
      });
    }

    // 5. Reveal feedback panel with timeout tone.
    showQuestionFeedback_('timeout');

    // 6. Refresh the HUD so the streak chip updates immediately.
    updateGameHUD();
  }


  /**
   * showQuestionFeedback_ – Shared helper that reveals the feedback
   * panel for the current question. Used by handleTimeUp now and by
   * handleAnswer in the next phase.
   *
   * @param {string} tone One of 'correct', 'wrong', 'timeout'.
   * @private
   */
  function showQuestionFeedback_(tone) {
    var q = state.questions[state.currentIdx];
    if (!q) return;

    var hdr = $('#feedbackHeader');
    if (hdr) {
      hdr.classList.remove('correct', 'wrong', 'timeout');

      if (tone === 'correct') {
        hdr.classList.add('correct');
        hdr.textContent = '✓ ถูกต้อง! เก่งมาก';
      } else if (tone === 'timeout') {
        hdr.classList.add('timeout');
        hdr.textContent = '⏰ หมดเวลา! คำตอบที่ถูกคือ ' + (q.correctAnswer || '');
      } else {
        hdr.classList.add('wrong');
        hdr.textContent = '✗ ไม่ถูกต้อง คำตอบที่ถูกคือ ' + (q.correctAnswer || '');
      }
    }

    setText('#feedbackExplanation', q.explanationTH || '—');
    setText('#feedbackTip',         q.tip           || '—');

    var fb = $('#feedbackBox');
    if (fb) fb.classList.remove('hidden');
  }


  /* =====================================================================
   * 10. GAME FLOW — ANSWER HANDLING
   * ===================================================================== */

  /**
   * handleAnswer – Runs when the user picks A, B, C, or D.
   * Stops the timer, locks further input, scores the answer, updates
   * round counters, and reveals the feedback panel with the correct
   * answer plus Thai explanation and tip.
   *
   * @param {string} choice One of 'A', 'B', 'C', 'D'.
   */
  function handleAnswer(choice) {
    // 1. Guard: ignore double-clicks and answers after timeout/lock.
    if (state.timer.locked) return;

    // 2. Validate the input letter.
    if (choice !== 'A' && choice !== 'B' && choice !== 'C' && choice !== 'D') {
      return;
    }

    // 3. Lock further input and stop the countdown.
    state.timer.locked = true;
    stopTimer();

    var q = state.questions[state.currentIdx];
    if (!q) return;

    // 4. Compute response time in seconds (used for the speed bonus).
    var responseTime =
      (Date.now() - (state.timer.questionStart || Date.now())) / 1000;

    // 5. Determine correctness and update streak / counters BEFORE
    //    calling calculateQuestionScore, because the streak bonus
    //    depends on the post-answer streak value.
    var correctLetter = q.correctAnswer || '';
    var isCorrect = (choice === correctLetter);

    if (isCorrect) {
      state.correctCount += 1;
      state.streak       += 1;
      state.coin         += CONSTANTS.COIN_PER_CORRECT;
    } else {
      state.wrongCount += 1;
      state.streak     = 0;

      // Log the mistake for the round-end batch save.
      state.mistakes.push({
        mode:           state.mode,
        questionId:     q.questionId || '',
        questionText:   q.questionText || '',
        selectedAnswer: choice,
        correctAnswer:  correctLetter,
        category:       q.category || ''
      });
    }

    // 6. Award points + EXP for this question.
    var earned = calculateQuestionScore(isCorrect, responseTime);
    state.score += earned;
    state.exp   += earned;

    // 7. Visual + textual feedback.
    disableAnswerButtons();
    highlightCorrectAndWrongChoices(choice, correctLetter);
    showExplanation(isCorrect, choice);

    // 8. Refresh the HUD so score and streak update immediately.
    updateGameHUD();
  }


  /**
   * calculateQuestionScore – Pure score calculation for one question.
   * The caller must have already updated state.streak so the streak
   * bonus is evaluated against the post-answer streak value.
   *
   * Rules:
   *   - Wrong answer:       0 points.
   *   - Correct answer:    +CONSTANTS.BASE_POINT (10).
   *   - Within 5 seconds:  +CONSTANTS.SPEED_BONUS (5).
   *   - Streak ÷ 3 == 0:   +CONSTANTS.STREAK_BONUS (10).
   *
   * @param {boolean} isCorrect    Whether the answer was correct.
   * @param {number}  responseTime Seconds elapsed since the question loaded.
   * @return {number} Points earned for this question (>= 0).
   */
  function calculateQuestionScore(isCorrect, responseTime) {
    if (!isCorrect) return 0;

    var earned = CONSTANTS.BASE_POINT;

    // Speed bonus.
    if (typeof responseTime === 'number' &&
        responseTime <= CONSTANTS.SPEED_BONUS_LIMIT) {
      earned += CONSTANTS.SPEED_BONUS;
    }

    // Streak bonus every Nth correct in a row.
    if (state.streak > 0 &&
        state.streak % CONSTANTS.STREAK_INTERVAL === 0) {
      earned += CONSTANTS.STREAK_BONUS;
    }

    return earned;
  }


  /**
   * showExplanation – Reveals the feedback panel for the answered
   * question with the appropriate correct/wrong tone, the Thai
   * explanation, and the study tip. Delegates the low-level DOM work
   * to showQuestionFeedback_ so the timeout path stays in sync.
   *
   * @param {boolean} isCorrect      Whether the answer was correct.
   * @param {string}  selectedChoice The letter the user picked.
   */
  function showExplanation(isCorrect, selectedChoice) {
    // selectedChoice is accepted for API compatibility but not needed
    // by the renderer — showQuestionFeedback_ already includes the
    // correct answer in the header for wrong responses.
    showQuestionFeedback_(isCorrect ? 'correct' : 'wrong');
  }


  /**
   * disableAnswerButtons – Marks every choice button as disabled both
   * visually and interactively, so further clicks are ignored even if
   * the timer-locked flag is bypassed.
   */
  function disableAnswerButtons() {
    var btns = $$('#choicesBox .choice-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = true;
      btns[i].setAttribute('aria-disabled', 'true');
      btns[i].classList.add('disabled');
    }
  }


  /**
   * highlightCorrectAndWrongChoices – Applies tone classes to the four
   * choice buttons after an answer is registered:
   *   - The correct letter gets .correct (green pulse).
   *   - The user's wrong pick (if any) gets .wrong (red shake).
   *   - Every other letter gets .muted to recede visually.
   *
   * @param {string} selectedChoice The letter the user picked.
   * @param {string} correctAnswer  The correct letter for the question.
   */
  function highlightCorrectAndWrongChoices(selectedChoice, correctAnswer) {
    var btns = $$('#choicesBox .choice-btn');
    for (var i = 0; i < btns.length; i++) {
      var btn = btns[i];
      var letter = btn.getAttribute('data-choice');

      if (letter === correctAnswer) {
        btn.classList.add('correct');
      } else if (letter === selectedChoice) {
        btn.classList.add('wrong');
      } else {
        btn.classList.add('muted');
      }
    }
  }


  /* =====================================================================
   * 11. GAME FLOW — ADVANCING & FINISHING
   * ===================================================================== */

  /**
   * nextQuestion – Stops the timer and moves to the next question in
   * the queue. When there are no more questions left, hands off to
   * finishGame() instead of trying to render.
   */
  function nextQuestion() {
    stopTimer();
    state.currentIdx += 1;

    if (state.currentIdx >= state.questions.length) {
      finishGame();
    } else {
      renderQuestion();
    }
  }


  /**
   * finishGame – Closes out the round.
   * Adds the per-round EXP completion bonus, computes final stats,
   * persists them on state, switches to the result screen, and kicks
   * off the score submission to the back end.
   */
  function finishGame() {
    stopTimer();

    // Completion bonus.
    state.exp += CONSTANTS.EXP_PER_ROUND;

    // Compute final stats and apply derived fields to state.
    var stats = calculateFinalStats();
    state.level = stats.level;
    state.badge = stats.badge;

    // Render the result screen.
    renderResult(stats);

    // Submit to the back end (added in Phase 5H).
    if (typeof submitScore === 'function') {
      submitScore();
    } else {
      console.warn('finishGame: submitScore() not yet implemented.');
    }
  }


  /**
   * calculateFinalStats – Derives accuracy, level, badge, and a "weak
   * area" suggestion from the current state. Pure: does not mutate.
   *
   * @return {Object} { accuracy, level, badge, weakArea }
   */
  function calculateFinalStats() {
    var totalAnswered = state.correctCount + state.wrongCount;
    var accuracy = totalAnswered > 0
      ? (state.correctCount / totalAnswered)
      : 0;

    // Every EXP_PER_LEVEL EXP earns a level. Floor + 1 keeps the
    // minimum at level 1 even with 0 EXP.
    var perLevel = CONSTANTS.EXP_PER_LEVEL || 100;
    var level = Math.max(1, Math.floor(state.exp / perLevel) + 1);

    // Badge: awarded only when accuracy meets the threshold.
    var badge = '';
    if (accuracy >= CONSTANTS.BADGE_THRESHOLD) {
      badge = CONSTANTS.BADGE_NAME;
    }

    // Weak area: most-frequent mistake category for the round.
    var weakArea = computeWeakArea_();

    return {
      accuracy: accuracy,
      level:    level,
      badge:    badge,
      weakArea: weakArea
    };
  }


  /**
   * computeWeakArea_ – Returns the category name with the highest
   * mistake count for this round, or '' if there were no mistakes
   * (or no usable category labels).
   * @return {string}
   * @private
   */
  function computeWeakArea_() {
    if (!state.mistakes || state.mistakes.length === 0) {
      return '';
    }

    var counts = {};
    for (var i = 0; i < state.mistakes.length; i++) {
      var cat = (state.mistakes[i] && state.mistakes[i].category) || '';
      cat = cat.toString().trim();
      if (!cat) continue;
      counts[cat] = (counts[cat] || 0) + 1;
    }

    var topName = '';
    var topCount = 0;
    for (var key in counts) {
      if (counts.hasOwnProperty(key) && counts[key] > topCount) {
        topName  = key;
        topCount = counts[key];
      }
    }
    return topName;
  }


  /**
   * renderResult – Paints the Result screen using the player profile,
   * round counters, and the stats object from calculateFinalStats().
   * Switches to the result screen as the first step so any animations
   * trigger from the visible screen.
   *
   * @param {Object} [stats] Optional — falls back to recomputing if absent.
   */
  function renderResult(stats) {
    if (!stats) {
      stats = calculateFinalStats();
    }

    showScreen('result');

    // Emoji tone reflects performance band.
    var emoji;
    if (stats.accuracy >= CONSTANTS.BADGE_THRESHOLD) {
      emoji = '🏆';
    } else if (stats.accuracy >= 0.5) {
      emoji = '🎯';
    } else {
      emoji = '💪';
    }
    setText('#resultEmoji', emoji);

    // Subtitle: player name • mode • target score.
    var subtitle =
      'ผู้เล่น: ' + (state.playerName || '—') +
      ' • โหมด: ' + (state.mode || '—') +
      ' • เป้าหมาย: ' + (state.targetScore || '—');
    setText('#resultSubtitle', subtitle);

    // Stat cards.
    setText('#statScore',    state.score);
    setText('#statAccuracy', Math.round(stats.accuracy * 100) + '%');
    setText('#statCorrect',  state.correctCount);
    setText('#statWrong',    state.wrongCount);
    setText('#statExp',      state.exp);
    setText('#statCoin',     state.coin);
    setText('#statLevel',    stats.level);
    setText('#statBadge',    stats.badge ? stats.badge : '—');

    // Weak area recommendation (rendered into a dynamically created
    // panel so we don't need to extend Index.html).
    renderWeakArea_(stats.weakArea);
  }


  /**
   * renderWeakArea_ – Adds (or updates) a small recommendation panel
   * inside the Result card pointing the user at the category they
   * missed most often. Hidden when there is no weak area.
   *
   * @param {string} weakArea Category label, or empty string.
   * @private
   */
  function renderWeakArea_(weakArea) {
    var card = $('#screenResult .card');
    if (!card) return;

    var panel = $('#resultWeakArea');

    // No weak area → ensure the panel is gone / hidden.
    if (!weakArea) {
      if (panel) panel.classList.add('hidden');
      return;
    }

    // Lazily create the panel on the first round that needs it.
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'resultWeakArea';
      panel.className = 'feedback';
      panel.style.marginTop = '16px';

      var label = document.createElement('div');
      label.className = 'feedback-label';
      label.textContent = 'จุดที่ควรพัฒนา';

      var text = document.createElement('div');
      text.className = 'feedback-text';
      text.id = 'resultWeakAreaText';

      panel.appendChild(label);
      panel.appendChild(text);

      // Insert just before the action row so it stays above the buttons.
      var actionRow = $('#screenResult .action-row');
      if (actionRow && actionRow.parentNode === card) {
        card.insertBefore(panel, actionRow);
      } else {
        card.appendChild(panel);
      }
    }

    panel.classList.remove('hidden');
    setText('#resultWeakAreaText',
      'หมวดที่คุณตอบผิดบ่อยที่สุด: ' + weakArea +
      ' — ลองฝึกเพิ่มในหมวดนี้เพื่อเก็บคะแนน!');
  }


  /* =====================================================================
   * 12. GAME FLOW — SUBMIT, LEADERBOARD & NAVIGATION
   * ===================================================================== */

  /**
   * submitScore – Persists the finished round to the back end via
   * google.script.run.submitGameResult(result).
   *
   * Payload shape (matches Code.gs/submitGameResult):
   *   { playerName, targetScore, mode, score,
   *     correct, wrong, accuracy, exp, coin, level, badge, mistakes }
   *
   * Note: the back end expects `correct` / `wrong` (not the front-end's
   * `correctCount` / `wrongCount`), so we map field names here.
   */
  function submitScore() {
    if (!window.google || !google.script || !google.script.run) {
      // Off-line preview fallback — we still want the user to see the
      // result and leaderboard buttons even though no row is saved.
      console.warn('submitScore: google.script.run unavailable.');
      showToast('โหมดดูตัวอย่างเท่านั้น คะแนนจะไม่ถูกบันทึก', 'info', 3500);
      return;
    }

    var totalAnswered = state.correctCount + state.wrongCount;
    var accuracy = totalAnswered > 0
      ? (state.correctCount / totalAnswered)
      : 0;

    var payload = {
      playerName:  state.playerName || '',
      targetScore: state.targetScore || 0,
      mode:        state.mode || '',
      score:       state.score || 0,
      correct:     state.correctCount || 0,
      wrong:       state.wrongCount || 0,
      accuracy:    accuracy,
      exp:         state.exp || 0,
      coin:        state.coin || 0,
      level:       state.level || 1,
      badge:       state.badge || '',
      mistakes:    state.mistakes || []
    };

    showToast('กำลังบันทึกคะแนน...', 'info', 1500);

    google.script.run
      .withSuccessHandler(function (response) {
        // Backend returns { ok, savedAt, mistakesSaved } on success.
        var saved = (response && response.mistakesSaved) || 0;
        var msg = 'บันทึกคะแนนสำเร็จ' +
          (saved > 0 ? ' (เก็บข้อผิด ' + saved + ' ข้อไว้ทบทวน)' : '');
        showToast(msg, 'success', 3200);
      })
      .withFailureHandler(function (err) {
        var detail = (err && err.message) ? err.message : String(err || '');
        console.warn('submitGameResult failed: ' + detail);
        showError('บันทึกคะแนนไม่สำเร็จ กรุณาลองใหม่ภายหลัง');
      })
      .submitGameResult(payload);
  }


  /**
   * loadLeaderboard – Pulls the latest top-10 entries from the back
   * end and hands the result to renderLeaderboard().
   */
  function loadLeaderboard() {
    showLoading('กำลังโหลดกระดานผู้นำ...');

    if (!window.google || !google.script || !google.script.run) {
      hideLoading();
      // Render an empty state so the screen still shows something useful.
      renderLeaderboard([]);
      return;
    }

    google.script.run
      .withSuccessHandler(function (data) {
        hideLoading();
        renderLeaderboard(Array.isArray(data) ? data : []);
      })
      .withFailureHandler(function (err) {
        hideLoading();
        var detail = (err && err.message) ? err.message : String(err || '');
        console.warn('getLeaderboard failed: ' + detail);
        showError('โหลดกระดานผู้นำไม่สำเร็จ');
        renderLeaderboard([]);
      })
      .getLeaderboard();
  }


  /**
   * renderLeaderboard – Paints the top-10 table.
   * Falls back to an empty state when the array is empty.
   *
   * Each entry is shaped by Code.gs/getLeaderboard:
   *   { rank, playerName, targetScore, mode, score,
   *     correctCount, wrongCount, accuracy, exp, coin, level, badge, timestamp }
   *
   * The visible columns in Index.html are:
   *   # | ผู้เล่น (with Lv./badge sub-line) | โหมด | คะแนน | แม่นยำ
   *
   * @param {Array<Object>} data
   */
  function renderLeaderboard(data) {
    showScreen('leaderboard');

    var body = $('#leaderboardBody');
    var empty = $('#leaderboardEmpty');

    if (!body) return;

    // Empty-state branch.
    if (!data || data.length === 0) {
      body.innerHTML = '';
      if (empty) empty.classList.remove('hidden');
      return;
    }
    if (empty) empty.classList.add('hidden');

    // Build rows.
    var rows = [];
    for (var i = 0; i < data.length && i < 10; i++) {
      var e = data[i] || {};
      var rank        = e.rank || (i + 1);
      var playerName  = String(e.playerName || '—');
      var mode        = String(e.mode || '—');
      var score       = (typeof e.score === 'number') ? e.score : 0;
      var accuracyPct = Math.round(((typeof e.accuracy === 'number') ? e.accuracy : 0) * 100);
      var level       = (typeof e.level === 'number') ? e.level : 1;
      var badge       = String(e.badge || '');

      // Medal for the top three.
      var medal;
      if (rank === 1)      medal = '🥇';
      else if (rank === 2) medal = '🥈';
      else if (rank === 3) medal = '🥉';
      else                 medal = String(rank);

      // Player cell with Lv./badge sub-line.
      var subline = 'Lv. ' + level;
      if (badge) {
        subline += ' · 🏅 ' + badge;
      }

      rows.push(
        '<tr class="rank-' + rank + '">' +
          '<td class="col-rank rank">' +
            '<span class="rank-medal">' + escapeHtml_(medal) + '</span>' +
          '</td>' +
          '<td class="col-name">' +
            '<div>' + escapeHtml_(playerName) + '</div>' +
            '<div class="muted" style="font-size:0.78rem;margin-top:2px;">' +
              escapeHtml_(subline) +
            '</div>' +
          '</td>' +
          '<td class="col-mode">' + escapeHtml_(mode) + '</td>' +
          '<td class="col-score">' + score + '</td>' +
          '<td class="col-acc">' + accuracyPct + '%</td>' +
        '</tr>'
      );
    }

    body.innerHTML = rows.join('');
  }


  /**
   * escapeHtml_ – Minimal HTML escaper for the few places where we
   * build markup as strings (the leaderboard rows above). Keeps the
   * UI safe even if a player name slipped past server sanitization.
   * @param {string} s
   * @return {string}
   * @private
   */
  function escapeHtml_(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }


  /**
   * goToStartScreen – Navigation helper. Used by toolbar buttons that
   * just want to flip to the start screen without resetting state.
   */
  function goToStartScreen() {
    showScreen('start');
  }


  /**
   * goToModeSelection – Navigation helper. Used by toolbar buttons
   * that flip to the mode-selection screen, preserving the player
   * profile (name + target score).
   */
  function goToModeSelection() {
    if (!state.playerName || !state.targetScore) {
      // Player profile missing — bounce them back to the start screen
      // instead of showing an empty greeting.
      showScreen('start');
      return;
    }
    setText('#modePlayerName', state.playerName);
    showScreen('mode');
  }


  /* =====================================================================
   * 13. INTERNAL WIRING
   * ===================================================================== */

  /**
   * wireStartScreenInputs_ – Listeners that belong to the Start screen:
   * target-score chip selection, name-field length cap, and the two
   * action buttons (Start, View Leaderboard).
   * @private
   */
  function wireStartScreenInputs_() {
    // Target score chip selection (single-select radiogroup).
    var chips = $$('#targetScoreOptions .option-chip');
    for (var i = 0; i < chips.length; i++) {
      (function (chip) {
        chip.addEventListener('click', function () {
          for (var j = 0; j < chips.length; j++) {
            chips[j].classList.remove('selected');
            chips[j].setAttribute('aria-checked', 'false');
          }
          chip.classList.add('selected');
          chip.setAttribute('aria-checked', 'true');

          var raw = chip.getAttribute('data-target');
          var val = parseInt(raw, 10);
          if (CONSTANTS.ALLOWED_TARGETS.indexOf(val) !== -1) {
            state.targetScore = val;
          }
        });
      })(chips[i]);
    }

    // Live trim of the player-name field so it never exceeds the
    // server-side limit, and Enter-key shortcut.
    var nameEl = $('#playerNameInput');
    if (nameEl) {
      nameEl.addEventListener('input', function () {
        if (nameEl.value.length > CONSTANTS.MAX_NAME_LENGTH) {
          nameEl.value = nameEl.value.substring(0, CONSTANTS.MAX_NAME_LENGTH);
        }
      });
      nameEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          startGame();
        }
      });
    }

    // Start button.
    var startBtn = $('#startButton');
    if (startBtn) {
      startBtn.addEventListener('click', startGame);
    }

    // "View Leaderboard" shortcut from the Start screen. The full
    // leaderboard loading logic is added in a later phase; for now we
    // simply switch to the leaderboard screen so the layout is testable.
    var viewBoardBtn = $('#viewLeaderboardFromStart');
    if (viewBoardBtn) {
      viewBoardBtn.addEventListener('click', function () {
        showScreen('leaderboard');
        if (typeof loadLeaderboard === 'function') {
          loadLeaderboard();
        }
      });
    }
  }


  /**
   * wireGameScreenInputs_ – Listeners that belong to the Game screen.
   * Choice buttons forward to handleAnswer(); the Next and Quit
   * buttons are wired once and stay live for every question.
   * @private
   */
  function wireGameScreenInputs_() {
    // Choice A/B/C/D – delegate via the data-choice attribute.
    var choiceBtns = $$('#choicesBox .choice-btn');
    for (var i = 0; i < choiceBtns.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          // Ignore clicks once the question has been answered or timed out.
          if (state.timer.locked) return;
          var letter = btn.getAttribute('data-choice');
          if (letter !== 'A' && letter !== 'B' && letter !== 'C' && letter !== 'D') {
            return;
          }
          if (typeof handleAnswer === 'function') {
            handleAnswer(letter);
          } else {
            console.warn('handleAnswer() not yet implemented.');
          }
        });
      })(choiceBtns[i]);
    }

    // Next button (revealed inside the feedback panel).
    var nextBtn = $('#nextButton');
    if (nextBtn) {
      nextBtn.addEventListener('click', function () {
        if (typeof nextQuestion === 'function') {
          nextQuestion();
        }
      });
    }

    // Quit button (returns to Start).
    var quitBtn = $('#quitButton');
    if (quitBtn) {
      quitBtn.addEventListener('click', function () {
        var ok = window.confirm('ต้องการออกจากเกมนี้และกลับหน้าเริ่มต้นใช่หรือไม่?');
        if (ok) {
          resetGame();
        }
      });
    }
  }


  /**
   * wireLeaderboardScreenInputs_ – Listeners for the leaderboard
   * topbar (back, refresh) and footer (play again, home) buttons.
   * @private
   */
  function wireLeaderboardScreenInputs_() {
    var backBtn = $('#leaderboardBack');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        // If the user has a profile, send them to mode selection;
        // otherwise back to start.
        if (state.playerName && state.targetScore) {
          goToModeSelection();
        } else {
          goToStartScreen();
        }
      });
    }

    var refreshBtn = $('#leaderboardRefresh');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function () {
        loadLeaderboard();
      });
    }

    var playBtn = $('#leaderboardPlay');
    if (playBtn) {
      playBtn.addEventListener('click', function () {
        if (state.playerName && state.targetScore) {
          goToModeSelection();
        } else {
          goToStartScreen();
        }
      });
    }

    var homeBtn = $('#leaderboardHome');
    if (homeBtn) {
      homeBtn.addEventListener('click', function () {
        resetGame();
      });
    }
  }


  /**
   * wireResultScreenInputs_ – Listeners for the three Result-screen
   * buttons: play again (back to mode selection), view leaderboard,
   * and back to start.
   * @private
   */
  function wireResultScreenInputs_() {
    var playAgain = $('#resultPlayAgain');
    if (playAgain) {
      playAgain.addEventListener('click', function () {
        // Keep the player profile; let the user pick a (possibly new) mode.
        showScreen('mode');
      });
    }

    var viewBoard = $('#resultViewBoard');
    if (viewBoard) {
      viewBoard.addEventListener('click', function () {
        showScreen('leaderboard');
        if (typeof loadLeaderboard === 'function') {
          loadLeaderboard();
        }
      });
    }

    var resetBtn = $('#resultReset');
    if (resetBtn) {
      resetBtn.addEventListener('click', function () {
        resetGame();
      });
    }
  }


  /**
   * wireModeScreenInputs_ – Listeners that belong to the Mode Selection
   * screen: the three mode cards and the back-to-start button.
   * @private
   */
  function wireModeScreenInputs_() {
    var modeCards = $$('#screenMode .mode-card');
    for (var i = 0; i < modeCards.length; i++) {
      (function (card) {
        card.addEventListener('click', function () {
          var mode = card.getAttribute('data-mode');
          selectMode(mode);
        });
      })(modeCards[i]);
    }

    var backBtn = $('#backToStart');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        showScreen('start');
      });
    }
  }

  /**
   * applySettings_ – Overlays values returned from the server onto
   * CONSTANTS so the rest of the app uses sheet-driven configuration.
   * Unknown keys are ignored.
   * @param {Object} settings Key/value object from getSettings().
   * @private
   */
  function applySettings_(settings) {
    if (!settings || typeof settings !== 'object') return;

    state.settings = settings;

    if (typeof settings.TimerSeconds === 'number' && settings.TimerSeconds > 0) {
      CONSTANTS.TIMER_SECONDS = settings.TimerSeconds;
      state.timer.secondsLeft = settings.TimerSeconds;
    }
    if (typeof settings.QuestionsPerRound === 'number' && settings.QuestionsPerRound > 0) {
      CONSTANTS.QUESTIONS_PER_ROUND = settings.QuestionsPerRound;
    }
    if (typeof settings.BasePoint === 'number')      CONSTANTS.BASE_POINT       = settings.BasePoint;
    if (typeof settings.SpeedBonus === 'number')     CONSTANTS.SPEED_BONUS      = settings.SpeedBonus;
    if (typeof settings.StreakBonus === 'number')    CONSTANTS.STREAK_BONUS     = settings.StreakBonus;
    if (typeof settings.BadgeThreshold === 'number') CONSTANTS.BADGE_THRESHOLD  = settings.BadgeThreshold;
    if (typeof settings.ExpPerRound === 'number')    CONSTANTS.EXP_PER_ROUND    = settings.ExpPerRound;
    if (typeof settings.CoinPerCorrect === 'number') CONSTANTS.COIN_PER_CORRECT = settings.CoinPerCorrect;
    if (typeof settings.ExpPerLevel === 'number')    CONSTANTS.EXP_PER_LEVEL    = settings.ExpPerLevel;
  }


  /* =====================================================================
   * 14. EXPORTS & BOOT
   * ---------------------------------------------------------------------
   *  Expose a small namespace so later phases (and inline handlers, if
   *  any) can call the controller without polluting the global scope.
   *  Public API will grow as later phases add startGame, selectMode,
   *  loadQuestions, etc.
   * ===================================================================== */

  window.TOEICQuest = {
    initApp:           initApp,
    resetGame:         resetGame,
    startGame:         startGame,
    selectMode:        selectMode,
    loadQuestions:     loadQuestions,
    renderQuestion:    renderQuestion,
    startTimer:        startTimer,
    stopTimer:         stopTimer,
    handleAnswer:      handleAnswer,
    showExplanation:   showExplanation,
    nextQuestion:      nextQuestion,
    finishGame:        finishGame,
    submitScore:       submitScore,
    renderResult:      renderResult,
    loadLeaderboard:   loadLeaderboard,
    renderLeaderboard: renderLeaderboard,
    goToStartScreen:   goToStartScreen,
    goToModeSelection: goToModeSelection,
    showScreen:        showScreen,
    showToast:         showToast,
    showError:         showError,
    // Internal hooks exposed for later phases to hang behavior off of:
    _state:     state,
    _const:     CONSTANTS,
    _$:         $,
    _$$:        $$,
    _setText:   setText,
    _setHidden: setHidden,
    _showLoading: showLoading,
    _hideLoading: hideLoading
  };

  // Boot when the DOM is ready.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

})();
</script>
